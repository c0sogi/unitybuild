[build-system]
requires = ["uv_build>=0.9.26,<0.12"]
build-backend = "uv_build"

[project]
name = "unitybuild"
version = "0.1.0"
description = "Project-independent Unity build orchestration for Python and the terminal."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["unity", "build", "cli", "build-profiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "psutil>=7.2.2",
    "rich>=14.3.4",
    "questionary>=2.1,<3",
    "typer>=0.21.1",
    "pyyaml>=6.0.3",
    "tomlkit>=0.13,<1",
]

[project.scripts]
unitybuild = "unitybuild.cli:app"

[project.urls]
Repository = "https://github.com/c0sogi/unitybuild"
Issues = "https://github.com/c0sogi/unitybuild/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16.1", "pyright>=1.1.408"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
