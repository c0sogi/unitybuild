name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q
      - name: Repeat macOS cancellation checks
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for attempt in {1..10}; do
            uv run pytest tests/test_cancel_retry.py -q || exit 1
          done
      - run: uv build --no-sources
      - run: uvx --from twine twine check --strict dist/*
